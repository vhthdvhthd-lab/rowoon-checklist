    );
    const IconBarChart2 = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 20V10m-6 10V4M6 20v-4" /></svg>
    );
    const IconSun = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>

    const IconMoon = ({ className = "w-4 h-4" }) => (

    const IconFilter = ({ className = "w-4 h-4" }) => (

      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>

    const IconKey = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
    );
    const IconLock = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
    );
    const IconLogOut = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
    );
    const IconShieldCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
    );
    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
    );
    const IconBuilding = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
    );
    const IconUserCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
    );

    // --- INITIAL DATA SEEDS ---
    const INITIAL_ACCOUNTS = [
      { code: '00', name: '관리자', role: 'admin', teacherName: '전체' },
      { code: '01', name: '김교사', role: 'teacher', teacherName: '김교사' },
      { code: '02', name: '박교사', role: 'teacher', teacherName: '박교사' },
      { code: '03', name: '이교사', role: 'teacher', teacherName: '이교사' }
    ];

    const INITIAL_TEACHERS = ['김교사', '박교사', '이교사'];

    const INITIAL_PARTICIPANTS = [
      { id: '1', name: '강승희', teacher: '김교사', age: 24, gender: '여', order: 1 },
      { id: '2', name: '강주연', teacher: '김교사', age: 28, gender: '여', order: 2 },
      { id: '3', name: '김도현', teacher: '박교사', age: 22, gender: '남', order: 3 },
      { id: '4', name: '김수진', teacher: '박교사', age: 25, gender: '여', order: 4 },
      { id: '5', name: '김준범', teacher: '이교사', age: 30, gender: '남', order: 5 },
      { id: '6', name: '양애연', teacher: '이교사', age: 27, gender: '여', order: 6 },
      { id: '7', name: '양원철', teacher: '김교사', age: 29, gender: '남', order: 7 },
      { id: '8', name: '이형균', teacher: '박교사', age: 31, gender: '남', order: 8 }
    ];

    const PERSONAL_ACTIVITIES = [
      { key: 'study', label: '개별학습' },
      { key: 'tv', label: 'TV시청' },
      { key: 'fineMotor', label: '소근육활동' },
      { key: 'creation', label: '창작활동' },
      { key: 'other', label: '기타' }
    ];

    function App() {
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('daycare_accounts');
        return saved ? JSON.parse(saved) : INITIAL_ACCOUNTS;
      });

      const [facilityInfo, setFacilityInfo] = useState(() => {
        const saved = localStorage.getItem('daycare_facility_info');
        return saved ? JSON.parse(saved) : INITIAL_FACILITY_INFO;
      });

      const [currentAccount, setCurrentAccount] = useState(() => {
        const saved = localStorage.getItem('daycare_current_account');
        return saved ? JSON.parse(saved) : null;
      });

      const [inputCode, setInputCode] = useState('');
      const [loginError, setLoginError] = useState('');

      const [teachers, setTeachers] = useState(() => {
        const saved = localStorage.getItem('daycare_teachers');
        return saved ? JSON.parse(saved) : INITIAL_TEACHERS;
      });

      const [participants, setParticipants] = useState(() => {
        const saved = localStorage.getItem('daycare_participants');
        return saved ? JSON.parse(saved) : INITIAL_PARTICIPANTS;
      });

      const [selectedParticipantId, setSelectedParticipantId] = useState('1');
      const [teacherFilter, setTeacherFilter] = useState('전체');

      const today = useMemo(() => new Date(), []);
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth() + 1);

      const [hideWeekends, setHideWeekends] = useState(true);
      const [viewTab, setViewTab] = useState('personal'); // 'personal' | 'daily' | 'both'
      const [darkMode, setDarkMode] = useState(false);

      const [lastModifiedInfo, setLastModifiedInfo] = useState({ user: '담당직원', time: '방금 전' });

      const [toastMessage, setToastMessage] = useState('');
      const [isParticipantModalOpen, setIsParticipantModalOpen] = useState(false);
      const [isStatsModalOpen, setIsStatsModalOpen] = useState(false);
      const [newParticipantName, setNewParticipantName] = useState('');
      const [newParticipantTeacher, setNewParticipantTeacher] = useState('김교사');
      const [newTeacherName, setNewTeacherName] = useState('');
      const [newTeacherCode, setNewTeacherCode] = useState('');

      const [deleteConfirmTarget, setDeleteConfirmTarget] = useState(null);
      const [statsScope, setStatsScope] = useState('month');

      const [checklistData, setChecklistData] = useState(() => {
        const saved = localStorage.getItem('daycare_checklists_v2');
        return saved ? JSON.parse(saved) : {};
      });

      useEffect(() => {
        localStorage.setItem('daycare_accounts', JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        localStorage.setItem('daycare_facility_info', JSON.stringify(facilityInfo));
      }, [facilityInfo]);

      useEffect(() => {
        localStorage.setItem('daycare_teachers', JSON.stringify(teachers));
      }, [teachers]);

      useEffect(() => {
        localStorage.setItem('daycare_participants', JSON.stringify(participants));
      }, [participants]);

      useEffect(() => {
        localStorage.setItem('daycare_checklists_v2', JSON.stringify(checklistData));
      }, [checklistData]);

      useEffect(() => {
        if (currentAccount) {
          localStorage.setItem('daycare_current_account', JSON.stringify(currentAccount));
        } else {
          localStorage.removeItem('daycare_current_account');
        }
      }, [currentAccount]);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage('');
        }, 2500);
      };

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        const matched = accounts.find(a => a.code === inputCode.trim());
        if (matched) {
          setCurrentAccount(matched);
          setTeacherFilter('전체');
          setInputCode('');
          setLoginError('');
          showToast(`${matched.name}님 환영합니다.`);
        } else {
          setLoginError('올바른 접속 고유번호를 입력하세요.');
        }
      };

      const handleLogout = () => {
        setCurrentAccount(null);
        setInputCode('');
        setLoginError('');
      };

      const handleKeypadPress = (digit) => {
        if (inputCode.length < 6) {
          setInputCode(prev => prev + digit);
          setLoginError('');
        }
      };

      const handleKeypadDelete = () => {
        setInputCode(prev => prev.slice(0, -1));
      };

      const handleKeypadClear = () => {
        setInputCode('');
      };

      const monthDays = useMemo(() => {
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysArr = [];
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month - 1, d);
          const dayOfWeek = dateObj.getDay();
          const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

          if (hideWeekends && isWeekend) continue;

          const dayStr = String(d).padStart(2, '0');
          const monthStr = String(month).padStart(2, '0');
          const dateKey = `${year}-${monthStr}-${dayStr}`;
          const isToday = today.getFullYear() === year && (today.getMonth() + 1) === month && today.getDate() === d;

          daysArr.push({
            day: d,
            dateKey,
            dayName: dayNames[dayOfWeek],
            isWeekend,
            isToday
          });
        }

        return daysArr;
      }, [year, month, hideWeekends, today]);

      const filteredParticipants = useMemo(() => {
        if (teacherFilter === '전체') return participants;
        return participants.filter(p => p.teacher === teacherFilter);
      }, [participants, teacherFilter]);

      const currentParticipant = useMemo(() => {
        return participants.find(p => p.id === selectedParticipantId) || participants[0] || { id: '1', name: '강승희', teacher: '김교사' };
      }, [participants, selectedParticipantId]);

      const monthKey = `${year}-${String(month).padStart(2, '0')}`;
      const currentMonthRecord = useMemo(() => {
        return checklistData[selectedParticipantId]?.[monthKey] || { days: {}, integratedPersonalNote: '', integratedDailyNote: '' };
      }, [checklistData, selectedParticipantId, monthKey]);

      const updateChecklist = (updater) => {
        setChecklistData(prev => {
          const pData = prev[selectedParticipantId] || {};
          const mData = pData[monthKey] || { days: {}, integratedPersonalNote: '', integratedDailyNote: '' };
          const updatedMData = updater(mData);

          return {
            ...prev,
            [selectedParticipantId]: {
              ...pData,
              [monthKey]: updatedMData
            }
          };
        });
        setLastModifiedInfo({ user: currentAccount?.name || '담당자', time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) });
      };

      const handlePersonalToggle = (dateKey, actKey) => {
        updateChecklist(prev => {
          const dayObj = prev.days[dateKey] || { status: '등원', personal: {}, oral: '', meal: '', personalNote: '' };
          const currentVal = dayObj.personal?.[actKey];
          return {
            ...prev,
            days: {
              ...prev.days,
              [dateKey]: {
                ...dayObj,
                personal: {
                  ...(dayObj.personal || {}),
                  [actKey]: !currentVal
                }
              }
            }
          };
        });
      };

      const handleStatusChange = (dateKey, status) => {
        updateChecklist(prev => {
          const dayObj = prev.days[dateKey] || { status: '등원', personal: {}, oral: '', meal: '', personalNote: '' };
          return {
            ...prev,
            days: {
              ...prev.days,
              [dateKey]: {
                ...dayObj,
                status
              }
            }
          };
        });
      };

      const handleOralChange = (dateKey, val) => {
        updateChecklist(prev => {
          const dayObj = prev.days[dateKey] || { status: '등원', personal: {}, oral: '', meal: '', personalNote: '' };
          return {
            ...prev,
            days: {
              ...prev.days,
              [dateKey]: {
                ...dayObj,
                oral: dayObj.oral === val ? '' : val
              }
            }
          };
        });
      };

      const handleMealChange = (dateKey, val) => {
        updateChecklist(prev => {
          const dayObj = prev.days[dateKey] || { status: '등원', personal: {}, oral: '', meal: '', personalNote: '' };
          return {
            ...prev,
            days: {
              ...prev.days,
              [dateKey]: {
                ...dayObj,
                meal: dayObj.meal === val ? '' : val
              }
            }
          };
        });
      };

      const handlePersonalNoteChange = (dateKey, note) => {
        updateChecklist(prev => {
          const dayObj = prev.days[dateKey] || { status: '등원', personal: {}, oral: '', meal: '', personalNote: '' };
          return {
            ...prev,
            days: {
              ...prev.days,
              [dateKey]: {
                ...dayObj,
                personalNote: note
              }
            }
          };
        });
      };

      const handleIntegratedPersonalNoteChange = (note) => {
        updateChecklist(prev => ({
          ...prev,
          integratedPersonalNote: note
        }));
      };

      const handleIntegratedNoteChange = (note) => {
        updateChecklist(prev => ({
          ...prev,
          integratedDailyNote: note
        }));
      };

      const handleAddParticipant = () => {
        if (!newParticipantName.trim()) {
          showToast('이용인 이름을 입력해 주세요.');
          return;
        }
        const newId = String(Date.now());
        const newP = {
          id: newId,
          name: newParticipantName.trim(),
          teacher: newParticipantTeacher,
          age: 20,
          gender: '남',
          order: participants.length + 1
        };
        setParticipants(prev => [...prev, newP]);
        setNewParticipantName('');
        showToast(`${newP.name} 이용인이 등록되었습니다.`);
      };

      const handleDeleteParticipant = (id) => {
        const p = participants.find(item => item.id === id);
        if (p) {
          setDeleteConfirmTarget({ type: 'participant', id, name: p.name });
        }
      };

      const handleMoveParticipant = (index, direction) => {
        const updated = [...participants];
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= updated.length) return;
        const temp = updated[index];
        updated[index] = updated[targetIndex];
        updated[targetIndex] = temp;
        setParticipants(updated);
      };

      const handleAddTeacher = () => {
        if (!newTeacherName.trim()) {
          showToast('교사 이름을 입력하세요.');
          return;
        }
        if (!newTeacherCode.trim()) {
          showToast('접속 고유번호를 입력하세요.');
          return;
        }
        if (teachers.includes(newTeacherName.trim())) {
          showToast('이미 등록된 교사 이름입니다.');
          return;
        }
        const tName = newTeacherName.trim();
        const tCode = newTeacherCode.trim();

        setTeachers(prev => [...prev, tName]);
        setAccounts(prev => [...prev, { code: tCode, name: tName, role: 'teacher', teacherName: tName }]);
        setNewTeacherName('');
        setNewTeacherCode('');
        showToast(`${tName} 교사 및 고유번호(${tCode})가 등록되었습니다.`);
      };

      const handleDeleteTeacher = (teacherName) => {
        setDeleteConfirmTarget({ type: 'teacher', name: teacherName });
      };

      const handleUpdateTeacherName = (oldName, newName) => {
        const trimmedName = newName.trim();
        if (!trimmedName || oldName === trimmedName) return;
        if (teachers.includes(trimmedName)) {
          showToast('이미 등록된 교사 이름입니다.');
          return;
        }

        setTeachers(prev => prev.map(t => t === oldName ? trimmedName : t));
        setAccounts(prev => prev.map(a =>
          a.teacherName === oldName
            ? { ...a, name: a.role === 'teacher' ? trimmedName : a.name, teacherName: trimmedName }
            : a
        ));
        setParticipants(prev => prev.map(p =>
          p.teacher === oldName ? { ...p, teacher: trimmedName } : p
        ));
        if (teacherFilter === oldName) setTeacherFilter(trimmedName);
        showToast('교사 이름이 수정되었습니다.');
      };

      const handleUpdateAccountCode = (oldCode, newCode) => {
        if (!newCode.trim()) return;
        setAccounts(prev => prev.map(a => a.code === oldCode ? { ...a, code: newCode.trim() } : a));
        showToast('접속 고유번호가 업데이트되었습니다.');
      };

      const handleParticipantTeacherChange = (pId, newTeacher) => {
        setParticipants(prev => prev.map(p => p.id === pId ? { ...p, teacher: newTeacher } : p));
        showToast('담당 교사이 변경되었습니다.');
      };

      const handleUpdateFacilityInfo = (field, value) => {
        setFacilityInfo(prev => ({ ...prev, [field]: value }));
        showToast('기관 정보가 수정되었습니다.');
      };

      const confirmDeleteAction = () => {
        if (!deleteConfirmTarget) return;

        if (deleteConfirmTarget.type === 'participant') {
          setParticipants(prev => prev.filter(p => p.id !== deleteConfirmTarget.id));
          if (selectedParticipantId === deleteConfirmTarget.id) {
            setSelectedParticipantId(participants[0]?.id || '1');
          }
          showToast(`${deleteConfirmTarget.name} 이용인이 삭제되었습니다.`);
        } else if (deleteConfirmTarget.type === 'teacher') {
          const tName = deleteConfirmTarget.name;
          setTeachers(prev => prev.filter(t => t !== tName));
          setAccounts(prev => prev.filter(a => a.teacherName !== tName));
          showToast(`${tName} 교사이 삭제되었습니다.`);
        }

        setDeleteConfirmTarget(null);
      };

      const isTodayChecked = (pId) => {
        const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const pRecord = checklistData[pId]?.[monthKey]?.days?.[todayKey];
        if (!pRecord) return false;
        if (pRecord.status === '결석' || pRecord.status === '미지원') return true;
        return Object.values(pRecord.personal || {}).some(Boolean) || !!pRecord.oral || !!pRecord.meal;
      };

      const handlePrint = () => {
        window.print();
      };

      const extendedStats = useMemo(() => {
        const pData = checklistData[selectedParticipantId] || {};
        let targetKeys = Object.keys(pData);

        if (statsScope === 'month') {
          targetKeys = targetKeys.filter(k => k === monthKey);
        } else if (statsScope === 'year') {
          targetKeys = targetKeys.filter(k => k.startsWith(`${year}-`));
        }

        let totalAttendance = 0;
        let totalAbsent = 0;
        let totalUnsupported = 0;
        const personalCounts = { study: 0, tv: 0, fineMotor: 0, creation: 0, other: 0 };
        const oralCounts = { 상: 0, 중: 0, 하: 0 };
        const mealCounts = { 상: 0, 중: 0, 하: 0 };

        targetKeys.forEach(mKey => {
          const days = pData[mKey]?.days || {};
          Object.values(days).forEach(d => {
            if (d.status === '등원') totalAttendance++;
            else if (d.status === '결석') totalAbsent++;
            else if (d.status === '미지원') totalUnsupported++;

            if (d.personal) {
              Object.keys(d.personal).forEach(k => {
                if (d.personal[k]) personalCounts[k] = (personalCounts[k] || 0) + 1;
              });
            }

            if (d.oral) oralCounts[d.oral] = (oralCounts[d.oral] || 0) + 1;
            if (d.meal) mealCounts[d.meal] = (mealCounts[d.meal] || 0) + 1;
          });
        });

        const totalDays = totalAttendance + totalAbsent + totalUnsupported || 1;
        const overallAttendanceRate = Math.round((totalAttendance / totalDays) * 100);
        const maxPersonalCount = Math.max(...Object.values(personalCounts), 1);

        const monthlyTrend = targetKeys.map(mKey => {
          const days = pData[mKey]?.days || {};
          let att = 0, tot = 0, pTot = 0;
          Object.values(days).forEach(d => {
            tot++;
            if (d.status === '등원') att++;
            if (d.personal) {
              pTot += Object.values(d.personal).filter(Boolean).length;
            }
          });
          const attendRate = tot > 0 ? Math.round((att / tot) * 100) : 0;
          return {
            monthKey: mKey,
            label: `${mKey.split('-')[1]}월`,
            attendRate,
            attendance: att,
            personalTotal: pTot
          };
        });

        return {
          totalAttendance,
          totalAbsent,
          totalUnsupported,
          overallAttendanceRate,
          personalCounts,
          oralCounts,
          mealCounts,
          maxPersonalCount,
          targetMonthKeysCount: targetKeys.length || 1,
          monthlyTrend
        };
      }, [checklistData, selectedParticipantId, statsScope, year, monthKey]);

      if (!currentAccount) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4 font-sans">
            <div className="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-[#192755] border-2 border-[#FD6D9A] rounded-2xl flex items-center justify-center mx-auto shadow-lg">
                  <IconKey className="w-8 h-8 text-[#FD6D9A]" />
                </div>
                <h1 className="text-2xl font-black text-white tracking-tight">{facilityInfo.name}</h1>
                <p className="text-xs text-slate-400 font-medium">개인지원 체크리스트 - 접속 고유번호 입력</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5 text-center">
                    접속 고유번호 입력
                  </label>
                  <div className="relative">
                    <input
                      type="password"
                      value={inputCode}
                      onChange={(e) => {
                        setInputCode(e.target.value);
                        setLoginError('');
                      }}
                      placeholder="고유번호 입력"
                      className="w-full bg-slate-900 border-2 border-slate-700 focus:border-[#FD6D9A] focus:outline-none rounded-2xl py-3 text-center text-2xl font-black tracking-widest text-white transition"
                      maxLength={6}
                      autoFocus
                    />
                    {inputCode && (
                      <button
                        type="button"
                        onClick={handleKeypadClear}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1 cursor-pointer"
                      >
                        <IconX className="w-5 h-5" />
                      </button>
                    )}
                  </div>
                </div>

                {loginError && (
                  <p className="text-xs text-rose-400 font-extrabold text-center bg-rose-950/50 p-2.5 rounded-xl border border-rose-800">
                    {loginError}
                  </p>
                )}

                {/* NUMERIC KEYPAD */}
                <div className="grid grid-cols-3 gap-2 pt-2">
                  {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => handleKeypadPress(String(num))}
                      className="bg-slate-700/80 hover:bg-slate-600 active:bg-[#192755] text-white font-black text-xl py-3 rounded-2xl transition border border-slate-600 shadow-xs cursor-pointer"
                    >
                      {num}
                    </button>
                  ))}
                  <button
                    type="button"
                    onClick={handleKeypadClear}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-400 font-bold text-xs py-3 rounded-2xl transition border border-slate-700 cursor-pointer"
                  >
                    초기화
                  </button>
                  <button
                    type="button"
                    onClick={() => handleKeypadPress('0')}
                    className="bg-slate-700/80 hover:bg-slate-600 active:bg-[#192755] text-white font-black text-xl py-3 rounded-2xl transition border border-slate-600 shadow-xs cursor-pointer"
                  >
                    0
                  </button>
                  <button
                    type="button"
                    onClick={handleKeypadDelete}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs py-3 rounded-2xl transition border border-slate-700 cursor-pointer"
                  >
                    지우기
                  </button>
                </div>

                <button
                  type="submit"
                  className="w-full bg-[#FD6D9A] hover:bg-rose-500 text-white font-black py-3.5 rounded-2xl text-base shadow-lg transition flex items-center justify-center gap-2 cursor-pointer"
                >
                  <IconCheck className="w-5 h-5" />
                  로그인 (시스템 접속)
                </button>
              </form>

            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-10 transition-colors duration-200 print:bg-white print:text-black">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-[#192755] text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 border border-[#FD6D9A] animate-bounce no-print">
              <IconShieldCheck className="w-4 h-4 text-[#FD6D9A]" />
              <span className="text-xs font-bold">{toastMessage}</span>
            </div>
          )}

          {/* HEADER BAR */}
          <header className="bg-[#192755] text-white shadow-lg sticky top-0 z-30 no-print">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              
              <div className="flex items-center gap-3">
                <div>
                  <h1 className="font-extrabold text-base sm:text-lg leading-tight tracking-tight flex items-center gap-2">
                    {facilityInfo.name}
                  </h1>
                  <div className="flex items-center gap-2 text-[10px] text-slate-300 font-medium">
                    <span className="flex items-center gap-1">
                      {facilityInfo.phone}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center flex-wrap gap-2 text-xs">
                
                {/* LOGGED IN ACCOUNT BADGE */}
                <div className="flex items-center bg-white/10 px-3 py-1.5 rounded-xl border border-white/20 gap-2">
                  <IconUserCheck className="w-4 h-4 text-emerald-400" />
                  <div className="text-[11px] leading-tight">
                    <span className="font-extrabold text-white">{currentAccount.name}</span>
                    <span className={`ml-1 text-[10px] px-1.5 py-0.2 rounded font-black ${
                      currentAccount.role === 'admin' ? 'bg-[#FD6D9A] text-white' : 'bg-sky-600 text-white'
                    }`}>
                      {currentAccount.role === 'admin' ? '관리자' : '교사'}
                    </span>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="ml-1 p-1 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg transition cursor-pointer"
                    title="로그아웃"
                  >
                    <IconLogOut className="w-3.5 h-3.5" />
                  </button>
                </div>

                <div className="flex items-center bg-slate-800/80 px-2.5 py-1.5 rounded-xl border border-slate-700">
                  <IconCalendar className="w-4 h-4 text-[#FD6D9A] mr-1.5" />
                  <select
                    value={year}
                    onChange={(e) => setYear(Number(e.target.value))}
                    aria-label="연도 선택"
                    className="bg-transparent font-extrabold focus:outline-none cursor-pointer"
                  >
                    {[2024, 2025, 2026, 2027, 2028].map(y => (
                      <option key={y} value={y} className="bg-slate-800 text-white">{y}년</option>
                    ))}
                  </select>

                  <select
                    value={month}
                    onChange={(e) => setMonth(Number(e.target.value))}
                    aria-label="월 선택"
                    className="bg-transparent font-extrabold focus:outline-none cursor-pointer ml-1"
                  >
                    {Array.from({ length: 12 }, (_, i) => i + 1).map(m => (
                      <option key={m} value={m} className="bg-slate-800 text-white">{m}월</option>
                    ))}
                  </select>
                </div>

                {/* TEACHER FILTER DROPDOWN */}
                <div className="flex items-center bg-slate-800/80 px-2.5 py-1.5 rounded-xl border border-slate-700">
                  <IconFilter className="w-4 h-4 text-sky-400 mr-1.5" />
                  <span className="text-slate-400 mr-1 hidden sm:inline">담당필터:</span>
                  <select
                    value={teacherFilter}
                    onChange={(e) => setTeacherFilter(e.target.value)}
                    aria-label="담당 교사 필터"
                    className="bg-transparent font-extrabold focus:outline-none cursor-pointer text-sky-300"
                  >
                    <option value="전체" className="bg-slate-800 text-white">전체 이용인 보기 ({participants.length}명)</option>
                    {teachers.map(t => (
                      <option key={t} value={t} className="bg-slate-800 text-white">
                        {t} 담당 ({participants.filter(p => p.teacher === t).length}명)
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setIsStatsModalOpen(true)}
                    className="px-3 py-1.5 bg-[#FD6D9A] hover:bg-rose-500 text-white font-bold rounded-xl flex items-center gap-1 transition shadow-xs cursor-pointer"
                    title="상세 통계분석"
                  >
                    <IconBarChart2 className="w-4 h-4" />
                    <span className="hidden sm:inline">통계</span>
                  </button>

                  {/* ADMIN-ONLY MANAGEMENT BUTTON */}
                  <button
                    onClick={() => {
                      if (currentAccount.role === 'admin') {
                        setIsParticipantModalOpen(true);
                      } else {
                        showToast('이용인 및 교사 관리는 관리자(00)만 접근 가능합니다.');
                      }
                    }}
                    className={`px-3 py-1.5 font-bold rounded-xl flex items-center gap-1 transition cursor-pointer ${
                      currentAccount.role === 'admin'
                        ? 'bg-slate-700 hover:bg-slate-600 text-white'
                        : 'bg-slate-800 text-slate-400 opacity-80'
                    }`}
                    title={currentAccount.role === 'admin' ? '이용인 및 교사 관리' : '관리자 전용 기능'}
                  >
                    {currentAccount.role === 'admin' ? <IconSettings className="w-4 h-4" /> : <IconLock className="w-4 h-4 text-amber-400" />}
                    <span className="hidden sm:inline">관리 {currentAccount.role !== 'admin' && '(관리자)'}</span>
                  </button>

                  <button
                    onClick={handlePrint}
                    className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl flex items-center gap-1 transition cursor-pointer"
                    title="A4 서식 인쇄"
                  >
                    <IconPrinter className="w-4 h-4" />
                    <span className="hidden sm:inline">인쇄</span>
                  </button>

                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl transition text-amber-300 cursor-pointer"
                    title="다크모드 토글"
                  >
                    {darkMode ? <IconSun className="w-4 h-4" /> : <IconMoon className="w-4 h-4" />}
                  </button>
                </div>

              </div>
            </div>
          </header>

          {/* QUICK PARTICIPANT SELECTION TOOLBAR */}
          <div className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-xs no-print">
            <div className="max-w-7xl mx-auto px-4 py-2.5 space-y-2">
              
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-black text-slate-700 dark:text-slate-200 flex items-center gap-1.5 shrink-0">
                    <IconUsers className="w-4 h-4 text-[#192755] dark:text-sky-400" />
                    이용인 선택 목록
                  </span>

                  {/* QUICK FILTER SWITCH TABS */}
                  <div className="flex items-center bg-slate-100 dark:bg-slate-700 p-1 rounded-xl text-xs font-bold gap-1 border border-slate-200 dark:border-slate-600">
                    <button
                      onClick={() => setTeacherFilter('전체')}
                      className={`px-2.5 py-1 rounded-lg transition font-extrabold flex items-center gap-1 cursor-pointer ${
                        teacherFilter === '전체'
                          ? 'bg-[#192755] text-white shadow-xs'
                          : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
                      }`}
                    >
                      <span>👥 전체 보기 ({participants.length}명)</span>
                    </button>

                    {currentAccount.role === 'teacher' && (
                      <button
                        onClick={() => setTeacherFilter(currentAccount.teacherName)}
                        className={`px-2.5 py-1 rounded-lg transition font-extrabold flex items-center gap-1 cursor-pointer ${
                          teacherFilter === currentAccount.teacherName
                            ? 'bg-[#FD6D9A] text-white shadow-xs'
                            : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
                        }`}
                      >
                        <span>👤 내 담당만 보기 ({participants.filter(p => p.teacher === currentAccount.teacherName).length}명)</span>
                      </button>
                    )}
                  </div>
                </div>

                <div className="text-[11px] text-slate-500 dark:text-slate-400 font-semibold flex items-center gap-2">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 오늘 기록 작성 완료
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 ml-1"></span> 미완료
                </div>
              </div>

              {/* HORIZONTAL PARTICIPANT CHIP CARDS */}
              <div className="flex items-center gap-2 overflow-x-auto py-1 scrollbar-none">
                {filteredParticipants.map(p => {
                  const isSelected = p.id === selectedParticipantId;
                  const completedToday = isTodayChecked(p.id);
                  const isMyParticipant = currentAccount.teacherName === p.teacher;

                  return (
                    <button
                      key={p.id}
                      onClick={() => setSelectedParticipantId(p.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-2 shrink-0 border cursor-pointer ${
                        isSelected
                          ? 'bg-[#192755] text-white border-[#192755] shadow-md scale-105 ring-2 ring-[#FD6D9A]/50'
                          : 'bg-slate-50 dark:bg-slate-700/50 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <div className="flex flex-col items-start text-left leading-tight">
                        <div className="flex items-center gap-1.5">
                          <span className="text-sm font-extrabold">{p.name}</span>
                          {isMyParticipant && currentAccount.role === 'teacher' && (
                            <span className="text-[9px] bg-rose-500 text-white px-1 rounded font-bold">내담당</span>
                          )}
                        </div>
                        {teacherFilter === '전체' && (
                          <span className={`text-[9px] font-semibold ${isSelected ? 'text-sky-300' : 'text-slate-400'}`}>
                            {p.teacher}
                          </span>
                        )}
                      </div>

                      {completedToday ? (
                        <span className="text-[10px] bg-emerald-500 text-white px-1.5 py-0.5 rounded-full font-extrabold" title="오늘 기록 완료">완료</span>
                      ) : (
                        <span className="w-2.5 h-2.5 rounded-full bg-amber-400" title="오늘 기록 미완료"></span>

                    </button>
                  );

              </div>

          {/* MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 pt-4 space-y-4">

            {}
            <div className="bg-gradient-to-r from-[#192755] via-[#233775] to-[#192755] text-white rounded-2xl p-4 sm:p-6 shadow-xl border border-slate-700/50 flex flex-wrap items-center justify-between gap-4 no-print">
              
              <div className="flex items-center gap-4">
                <div>

                          const pct = Math.round((c / tot) * 100);
                          return (
                            <div key={lvl} className="flex items-center gap-2 text-xs">
                              <span className="w-5 font-bold text-slate-600 dark:text-slate-300">{lvl}</span>
                              <div className="flex-1 bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                <div className="bg-[#192755] dark:bg-sky-500 h-full rounded-full" style={{ width: `${pct}%` }} />
                              </div>
                              <span className="w-12 text-right font-bold text-slate-700 dark:text-slate-300">{c}회</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                </div>

                <div className="bg-slate-100 dark:bg-slate-900 px-5 py-3 border-t border-slate-200 dark:border-slate-700 text-right shrink-0">
                  <button
                    onClick={() => setIsStatsModalOpen(false)}
                    className="bg-[#192755] text-white px-5 py-2 rounded-xl text-xs font-extrabold hover:bg-[#233775] transition cursor-pointer"
                  >
                    확인 및 닫기
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
