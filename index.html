<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로운주간이용센터 체크리스트</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root{
  --bg:#F5F2EA;
  --surface:#FFFFFF;
  --row-alt:#FAF8F2;
  --ink:#242420;
  --muted:#8a887d;
  --line:#E5E1D3;
  --teal:#2F6B5E;
  --teal-light:#DCEAE4;
  --stamp:#B3392C;
  --stamp-light:#F6E3E0;
  --gold:#B8862E;
  --gold-light:#F5EAD4;
  --navy:#1B2333;
  --navy-2:#232D42;
  --pink:#D9527A;
  --green-dot:#3F9A5D;
  --orange-dot:#D8922E;
}
body.dark{
  --bg:#171A16;
  --surface:#20241E;
  --row-alt:#262A21;
  --ink:#EDEAE0;
  --muted:#9B9A8E;
  --line:#3A3C33;
  --teal-light:#26362F;
  --stamp-light:#3A2622;
  --gold-light:#382E19;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;padding-bottom:60px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px;}

.topbar{background:var(--navy);color:#fff;padding:14px 0;margin-bottom:16px;}
.topbar-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 14px;}
.brand{font-size:17px;font-weight:700;margin-right:auto;}
.brand-sub{font-size:11px;color:#9AA3B8;font-weight:400;display:block;}
.topbar select, .topbar-btn{
  background:var(--navy-2);
  color:#fff;
  border:1px solid #384157;
  border-radius:9px;
  padding:8px 10px;
  font-size:12.5px;
  font-family:'Pretendard',sans-serif;
  cursor:pointer;
}
.topbar-btn.accent{background:var(--pink);border-color:var(--pink);font-weight:700;}
.topbar-btn.ghost{background:transparent;}
.topbar-btn.icon{padding:8px 11px;}

.roster-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.roster-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.roster-head-title{font-size:13px;font-weight:700;color:var(--muted);}
.roster-strip{display:flex;gap:10px;flex-wrap:wrap;}
.user-chip{
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px 16px;
  cursor:pointer;
  min-width:110px;
  background:var(--row-alt);
  position:relative;
}
.user-chip.active{background:var(--navy);border-color:var(--navy);}
.user-chip .u-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;}
.user-chip.active .u-name{color:#fff;}
.user-chip .u-teacher{font-size:11px;color:var(--muted);margin-top:2px;}
.user-chip.active .u-teacher{color:#B9C0D4;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.green{background:var(--green-dot);}
.dot.orange{background:var(--orange-dot);}
.add-chip{
  border:1.5px dashed var(--line);
  border-radius:11px;
  padding:10px 16px;
  min-width:110px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
  background:transparent;
}
.empty-roster{color:var(--muted);font-size:13px;padding:10px 2px;}

.detail-bar{background:var(--navy);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.detail-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.detail-name{font-family:'Pretendard',serif;font-size:24px;font-weight:700;}
.detail-name .lbl{font-family:'Pretendard',sans-serif;font-size:14px;color:#B9C0D4;font-weight:400;margin-left:4px;}
.teacher-sel{
  background:var(--navy-2);color:#fff;border:1px solid #384157;border-radius:9px;
  padding:6px 10px;font-size:12.5px;font-family:'Pretendard',sans-serif;
}
.detail-meta{font-size:12px;color:#9AA3B8;margin-top:6px;}
.detail-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
.view-toggle{display:flex;border:1px solid #384157;border-radius:9px;overflow:hidden;}
.view-toggle button{
  background:var(--navy-2);color:#B9C0D4;border:none;padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:'Pretendard',sans-serif;
}
.view-toggle button.active{background:var(--pink);color:#fff;font-weight:700;}
.wknd-btn{background:var(--navy-2);color:#fff;border:1px solid #384157;border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer;font-family:'Pretendard',sans-serif;}
.wknd-btn.on{background:var(--teal);border-color:var(--teal);}

.table-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;margin-bottom:12px;}
table{border-collapse:collapse;width:100%;min-width:760px;}
thead th{background:var(--row-alt);color:var(--ink);font-size:12.5px;font-weight:700;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:nth-child(even){background:var(--row-alt);}
tbody tr.off-row{opacity:.45;}
tbody tr.weekend-row td.day-cell,tbody tr.weekend-row td.wk-cell{color:var(--stamp);}
.day-cell{font-size:13.5px;font-weight:700;white-space:nowrap;}
.wk-cell{font-size:12.5px;color:var(--muted);}

select.status-sel{border:1px solid var(--teal);background:var(--teal-light);color:var(--teal);font-weight:700;font-size:12px;border-radius:7px;padding:5px 6px;font-family:'Pretendard',sans-serif;}
select.status-sel.st-결석{background:var(--stamp-light);border-color:var(--stamp);color:var(--stamp);}
select.status-sel.st-미지원{background:var(--gold-light);border-color:var(--gold);color:var(--gold);}

.circle-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--row-alt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:13px;}
.circle-check.checked{background:var(--teal);border-color:var(--teal);color:#fff;}
tr.off-row .circle-check{pointer-events:none;}

.level-cell{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;}
.level-opt{padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--row-alt);font-size:11.5px;cursor:pointer;color:var(--muted);}
.level-opt.sel-상{background:var(--teal-light);border-color:var(--teal);color:var(--teal);font-weight:700;}
.level-opt.sel-중{background:var(--gold-light);border-color:var(--gold);color:var(--gold);font-weight:700;}
.level-opt.sel-하{background:var(--stamp-light);border-color:var(--stamp);color:var(--stamp);font-weight:700;}
tr.off-row .level-opt{pointer-events:none;}

.note-cell input{width:100%;min-width:150px;border:1px solid transparent;background:transparent;padding:5px 6px;font-size:12.5px;font-family:'Pretendard',sans-serif;color:var(--ink);}
.note-cell input:hover,.note-cell input:focus{border-color:var(--line);background:var(--surface);border-radius:6px;outline:none;}
.note-cell input::placeholder{color:#c4c1b4;}

.summary-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;}
.summary-title{font-size:13px;font-weight:700;color:var(--ink);margin-right:auto;}
.summary-pill{font-size:12.5px;color:var(--muted);}
.summary-pill b{color:var(--stamp);font-size:14px;}

.note-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.note-card-title{font-size:13px;font-weight:700;color:var(--teal);margin:0 0 10px;}
.note-card textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;font-family:'Pretendard',sans-serif;resize:vertical;background:var(--row-alt);color:var(--ink);}

.section-gap{height:16px;}

.footer-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:11.5px;color:var(--muted);padding:0 14px;max-width:1180px;margin-left:auto;margin-right:auto;}
.reset-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'Pretendard',sans-serif;}

.overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
.modal h3{margin:0 0 14px;font-size:16px;}
.modal-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.modal-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:'Pretendard',sans-serif;background:var(--row-alt);color:var(--ink);}
.modal-list{margin:10px 0;display:flex;flex-direction:column;gap:6px;}
.modal-list-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;}
.modal-list-item button{background:none;border:none;color:var(--stamp);cursor:pointer;font-size:12px;}
.modal-close{width:100%;margin-top:10px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--teal);color:#fff;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;}
.stat-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}

@media print{
  .topbar,.roster-card,.detail-controls,.footer-row,.overlay{display:none !important;}
  body{background:#fff;padding:0;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">로운주간이용센터<span class="brand-sub">이용인 생활기록카드</span></div>
    <select id="yearSel"></select>
    <select id="monthSel"></select>
    <select id="teacherFilter"></select>
    <button class="topbar-btn icon" id="statsBtn">통계</button>
    <button class="topbar-btn icon" id="manageBtn">관리</button>
    <button class="topbar-btn icon" id="printBtn">인쇄</button>
    <button class="topbar-btn icon ghost" id="darkBtn">🌙</button>
  </div>
</div>

<div class="wrap">

  <div class="roster-card">
    <div class="roster-head"><span class="roster-head-title" id="rosterCount">이용인 선택 목록</span></div>
    <div class="roster-strip" id="rosterStrip"></div>
  </div>

  <div class="detail-bar" id="detailBar"></div>

  <div id="mainContent"></div>

  <div class="footer-row">
    <span id="saveStatus">저장됨</span>
    <button class="reset-btn" id="resetBtn">현재 이용인 이번달 기록 초기화</button>
  </div>
</div>

<div class="overlay" id="manageOverlay">
  <div class="modal">
    <h3>이용인 관리</h3>
    <div class="modal-row">
      <input id="newName" placeholder="이름">
      <input id="newTeacher" placeholder="담당 교사">
    </div>
    <button class="modal-close" id="addUserBtn" style="margin-bottom:12px;">+ 이용인 추가</button>
    <div class="modal-list" id="userList"></div>
    <button class="modal-close" id="closeManage">닫기</button>
  </div>
</div>

<div class="overlay" id="statsOverlay">
  <div class="modal">
    <h3>이용인 통계</h3>
    <div class="modal-row" style="flex-wrap:wrap;">
      <select id="statStartY"></select>
      <select id="statStartM"></select>
      <span style="color:var(--muted);font-size:12px;">~</span>
      <select id="statEndY"></select>
      <select id="statEndM"></select>
    </div>
    <button class="modal-close" id="runStatsBtn" style="margin-bottom:10px;">조회</button>
    <div id="statsBody"></div>
    <button class="modal-close" id="closeStats">닫기</button>
  </div>
</div>

<script>
const WK = ['일','월','화','수','목','금','토'];
const PERSONAL_ITEMS = [
  {key:'individual', label:'개별학습'},
  {key:'tv', label:'TV시청'},
  {key:'fine', label:'소근육활동'},
  {key:'create', label:'창작활동'},
  {key:'etc', label:'기타'}
];
const LEVELS = ['상','중','하'];
const STATUS_OPTS = ['등원','결석','미지원'];

let roster = [];
let activeUserId = null;
let year = 2026, month = 8, hideWeekend = true, viewMode = 'personal', darkMode = false;
let currentRecord = null;
let lastSavedAt = null;

function uid(){ return 'u' + Date.now() + Math.random().toString(36).slice(2,6); }

function getDaysInView(){
  const days = [];
  const last = new Date(year, month, 0).getDate();
  for(let d=1; d<=last; d++){
    const dt = new Date(year, month-1, d);
    const wk = dt.getDay();
    if(hideWeekend && (wk === 0 || wk === 6)) continue;
    days.push({day:d, wk});
  }
  return days;
}

function emptyRecord(){
  const days = getDaysInView0();
  const rec = {status:{}, personal:{}, personalNote:'', daily:{}, dailyNote:''};
  days.forEach(d=>{
    rec.status[d.day] = '등원';
    rec.personal[d.day] = {items:{individual:false,tv:false,fine:false,create:false,etc:false}, note:''};
    rec.daily[d.day] = {oral:'', diet:'', note:''};
  });
  return rec;
}
function getDaysInView0(){
  const days = [];
  const last = new Date(year, month, 0).getDate();
  for(let d=1; d<=last; d++) days.push({day:d, wk:new Date(year, month-1, d).getDay()});
  return days;
}

async function saveRoster(){
  try{ await window.storage.set('roster-list', JSON.stringify(roster), false); }catch(e){}
}
async function loadRoster(){
  try{
    const res = await window.storage.get('roster-list', false);
    if(res && res.value) roster = JSON.parse(res.value);
  }catch(e){ roster = []; }
}

function recordKey(userId){ return `record-${userId}-${year}-${month}`; }

async function loadRecord(userId){
  const days = getDaysInView0();
  const base = emptyRecord();
  try{
    const res = await window.storage.get(recordKey(userId), false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      base.personalNote = loaded.personalNote || '';
      base.dailyNote = loaded.dailyNote || '';
      days.forEach(d=>{
        const legacyStatus = (loaded.personal && loaded.personal[d.day] && loaded.personal[d.day].status)
          || (loaded.daily && loaded.daily[d.day] && loaded.daily[d.day].status);
        if(loaded.status && loaded.status[d.day]) base.status[d.day] = loaded.status[d.day];
        else if(legacyStatus) base.status[d.day] = legacyStatus;
        if(loaded.personal && loaded.personal[d.day]){
          const {status, ...rest} = loaded.personal[d.day];
          base.personal[d.day] = Object.assign({items:{}, note:''}, rest);
        }
        if(loaded.daily && loaded.daily[d.day]){
          const {status, ...rest} = loaded.daily[d.day];
          base.daily[d.day] = Object.assign({oral:'', diet:'', note:''}, rest);
        }
      });
    }
  }catch(e){}
  return base;
}

let saveTimer=null;
function scheduleSave(){
  const el = document.getElementById('saveStatus');
  el.textContent = '저장 중…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!activeUserId) return;
    try{
      await window.storage.set(recordKey(activeUserId), JSON.stringify(currentRecord), false);
      lastSavedAt = new Date();
      el.textContent = '저장됨 · ' + lastSavedAt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      renderDetailBar();
    }catch(e){ el.textContent = '저장 실패'; }
  }, 400);
}

function hasAnyEntry(rec){
  const days = getDaysInView0();
  for(const d of days){
    const p = rec.personal[d.day];
    if(p && PERSONAL_ITEMS.some(it=>p.items[it.key])) return true;
    const dl = rec.daily[d.day];
    if(dl && (dl.oral || dl.diet)) return true;
  }
  return false;
}

function populateYearMonth(){
  const ySel = document.getElementById('yearSel');
  const mSel = document.getElementById('monthSel');
  ySel.innerHTML = [2025,2026,2027].map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}년</option>`).join('');
  mSel.innerHTML = Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===month?'selected':''}>${m}월</option>`).join('');
  ySel.addEventListener('change', async ()=>{ year=parseInt(ySel.value); await switchUser(activeUserId,true); });
  mSel.addEventListener('change', async ()=>{ month=parseInt(mSel.value); await switchUser(activeUserId,true); });
}

function populateTeacherFilter(){
  const sel = document.getElementById('teacherFilter');
  const teachers = Array.from(new Set(roster.map(u=>u.teacher).filter(Boolean)));
  sel.innerHTML = `<option value="">담당필터: 전체 이용인 보기 (${roster.length}명)</option>` +
    teachers.map(t=>`<option value="${t}">${t} 교사</option>`).join('');
  sel.value = sel.dataset.selected || '';
}

function renderRoster(){
  const strip = document.getElementById('rosterStrip');
  const filterVal = document.getElementById('teacherFilter').value;
  const filtered = roster.filter(u=> !filterVal || u.teacher===filterVal);
  document.getElementById('rosterCount').textContent = `이용인 선택 목록 · 전체 보기 (${roster.length}명)`;
  if(roster.length===0){
    strip.innerHTML = `<div class="empty-roster">등록된 이용인이 없습니다. 상단 '관리' 버튼으로 추가해주세요.</div>`;
    return;
  }
  strip.innerHTML = filtered.map(u=>{
    const complete = u._complete ? 'green' : 'orange';
    return `<div class="user-chip ${u.id===activeUserId?'active':''}" data-id="${u.id}">
      <div class="u-name">${u.name}<span class="dot ${complete}" title="이번달 기록 여부"></span></div>
      <div class="u-teacher">${u.teacher||'담당 미지정'}</div>
    </div>`;
  }).join('') + `<div class="add-chip" id="addChipBtn">+ 이용인 추가</div>`;

  strip.querySelectorAll('.user-chip').forEach(c=>{
    c.addEventListener('click', ()=> switchUser(c.dataset.id, false));
  });
  const addChip = document.getElementById('addChipBtn');
  if(addChip) addChip.addEventListener('click', openManage);
}

async function refreshDots(){
  for(const u of roster){
    try{
      const rec = await loadRecord(u.id);
      u._complete = hasAnyEntry(rec);
    }catch(e){ u._complete = false; }
  }
}

function renderDetailBar(){
  const bar = document.getElementById('detailBar');
  const user = roster.find(u=>u.id===activeUserId);
  if(!user){ bar.innerHTML = `<div class="detail-meta">이용인을 선택하거나 추가해주세요.</div>`; return; }
  const teachers = Array.from(new Set(roster.map(r=>r.teacher).filter(Boolean).concat(user.teacher?[user.teacher]:[])));
  bar.innerHTML = `
    <div class="detail-top">
      <div>
        <div class="detail-name">${user.name}<span class="lbl">이용인</span></div>
        <div class="detail-meta">
          담당 교사: <select class="teacher-sel" id="teacherSel">
            <option value="">미지정</option>
            ${teachers.map(t=>`<option value="${t}" ${t===user.teacher?'selected':''}>${t}</option>`).join('')}
          </select>
          &nbsp;|&nbsp; ${year}년 ${month}월 기록 &nbsp;|&nbsp; 최근수정: ${lastSavedAt? lastSavedAt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '없음'}
        </div>
      </div>
      <div class="detail-controls">
        <div class="view-toggle">
          <button data-mode="personal" class="${viewMode==='personal'?'active':''}">개인선택</button>
          <button data-mode="daily" class="${viewMode==='daily'?'active':''}">일상생활</button>
          <button data-mode="both" class="${viewMode==='both'?'active':''}">나란히 보기</button>
        </div>
        <button class="wknd-btn ${hideWeekend?'on':''}" id="wkndBtn">${hideWeekend?'주말 숨김':'주말 표시'}</button>
      </div>
    </div>
  `;
  document.getElementById('teacherSel').addEventListener('change', async (e)=>{
    user.teacher = e.target.value;
    await saveRoster();
    populateTeacherFilter();
    renderRoster();
  });
  bar.querySelectorAll('.view-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{ viewMode=b.dataset.mode; renderDetailBar(); renderMain(); });
  });
  document.getElementById('wkndBtn').addEventListener('click', async ()=>{
    hideWeekend = !hideWeekend;
    await switchUser(activeUserId, true);
  });
}

function renderMain(){
  const el = document.getElementById('mainContent');
  if(!activeUserId || !currentRecord){ el.innerHTML=''; return; }
  let html = '';
  if(viewMode==='personal' || viewMode==='both') html += personalTableHTML();
  if(viewMode==='both') html += '<div class="section-gap"></div>';
  if(viewMode==='daily' || viewMode==='both') html += dailyTableHTML();
  el.innerHTML = html;
  attachPersonalEvents();
  attachDailyEvents();
}

function personalTableHTML(){
  const days = getDaysInView();
  let rows = '';
  days.forEach(d=>{
    const rec = currentRecord.personal[d.day] || {items:{},note:''};
    const status = currentRecord.status[d.day] || '등원';
    const off = status !== '등원';
    const isWknd = d.wk===0 || d.wk===6;
    rows += `<tr class="${off?'off-row':''} ${isWknd?'weekend-row':''}" data-day="${d.day}">
      <td class="day-cell">${d.day}일</td>
      <td class="wk-cell">${WK[d.wk]}</td>
      <td><select class="status-sel ${status==='미지원'?'st-미지원':(status==='결석'?'st-결석':'')}" data-day="${d.day}">
        ${STATUS_OPTS.map(s=>`<option value="${s}" ${status===s?'selected':''}>${s}</option>`).join('')}
      </select></td>
      ${PERSONAL_ITEMS.map(it=>`<td><span class="circle-check ${rec.items[it.key]?'checked':''}" data-day="${d.day}" data-key="${it.key}">✓</span></td>`).join('')}
      <td class="note-cell"><input data-day="${d.day}" placeholder="특이사항 메모" value="${(rec.note||'').replace(/"/g,'&quot;')}"></td>
    </tr>`;
  });
  const totals = {};
  PERSONAL_ITEMS.forEach(it=>{ totals[it.key] = days.filter(d=>currentRecord.personal[d.day] && currentRecord.personal[d.day].items[it.key]).length; });
  return `
    <div class="table-card">
      <table>
        <thead><tr><th>날짜</th><th>요일</th><th>상태</th>${PERSONAL_ITEMS.map(it=>`<th>${it.label}</th>`).join('')}<th>비고</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="summary-bar">
      <span class="summary-title">월간 개인활동 자동 합계</span>
      ${PERSONAL_ITEMS.map(it=>`<span class="summary-pill">${it.label}: <b>${totals[it.key]}회</b></span>`).join('')}
    </div>
    <div class="note-card">
      <p class="note-card-title">개인선택활동 특이사항 및 종합 의견</p>
      <textarea id="personalNote" placeholder="활동 내용 및 종합 의견을 입력하세요...">${currentRecord.personalNote}</textarea>
    </div>
  `;
}

function attachPersonalEvents(){
  document.querySelectorAll('.circle-check').forEach(cb=>{
    cb.addEventListener('click', ()=>{
      const day=cb.dataset.day, key=cb.dataset.key;
      currentRecord.personal[day].items[key] = !currentRecord.personal[day].items[key];
      renderMain(); scheduleSave();
    });
  });
  document.querySelectorAll('.note-cell input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const day = inp.dataset.day;
      if(currentRecord.personal[day]) currentRecord.personal[day].note = inp.value;
      scheduleSave();
    });
  });
  document.querySelectorAll('.status-sel').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const day = sel.dataset.day;
      currentRecord.status[day] = sel.value;
      renderMain(); scheduleSave();
    });
  });
  const pn=document.getElementById('personalNote');
  if(pn) pn.addEventListener('input', ()=>{ currentRecord.personalNote = pn.value; scheduleSave(); });
}
function attachDailyEvents(){
  document.querySelectorAll('.level-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const day=opt.dataset.day, field=opt.dataset.field, val=opt.dataset.val;
      const rec = currentRecord.daily[day];
      rec[field] = rec[field]===val ? '' : val;
      renderMain(); scheduleSave();
    });
  });
  const dn=document.getElementById('dailyNote');
  if(dn) dn.addEventListener('input', ()=>{ currentRecord.dailyNote = dn.value; scheduleSave(); });
}

async function switchUser(userId, keepView){
  activeUserId = userId;
  if(!userId){ currentRecord=null; renderDetailBar(); renderMain(); renderRoster(); return; }
  currentRecord = await loadRecord(userId);
  lastSavedAt = null;
  renderDetailBar();
  renderMain();
  renderRoster();
}

let manageUnlocked = false;
function openManage(){
  if(!manageUnlocked){
    const code = prompt('관리자 코드를 입력하세요');
    if(code === null) return;
    if(code !== '00'){ alert('코드가 일치하지 않습니다.'); return; }
    manageUnlocked = true;
  }
  renderUserList();
  document.getElementById('manageOverlay').classList.add('show');
}
function renderUserList(){
  const list = document.getElementById('userList');
  list.innerHTML = roster.map(u=>`
    <div class="modal-list-item" style="flex-direction:column;align-items:stretch;gap:6px;">
      <div style="display:flex;gap:6px;">
        <input class="edit-name" data-id="${u.id}" value="${u.name.replace(/"/g,'&quot;')}" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;background:var(--row-alt);color:var(--ink);font-family:'Pretendard',sans-serif;">
        <input class="edit-teacher" data-id="${u.id}" value="${(u.teacher||'').replace(/"/g,'&quot;')}" placeholder="담당 교사" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;background:var(--row-alt);color:var(--ink);font-family:'Pretendard',sans-serif;">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button class="save-user" data-id="${u.id}" style="color:var(--teal);">저장</button>
        <button class="del-user" data-id="${u.id}">삭제</button>
      </div>
    </div>
  `).join('') || '<div style="font-size:12.5px;color:var(--muted);">등록된 이용인이 없습니다.</div>';

  list.querySelectorAll('.save-user').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.id;
      const u = roster.find(x=>x.id===id);
      if(!u) return;
      const nameInp = list.querySelector(`.edit-name[data-id="${id}"]`);
      const teacherInp = list.querySelector(`.edit-teacher[data-id="${id}"]`);
      if(!nameInp.value.trim()) { alert('이름을 입력해주세요.'); return; }
      u.name = nameInp.value.trim();
      u.teacher = teacherInp.value.trim();
      await saveRoster();
      populateTeacherFilter();
      renderRoster();
      if(activeUserId===id) renderDetailBar();
      b.textContent = '저장됨';
      setTimeout(()=>{ b.textContent='저장'; }, 1200);
    });
  });
  list.querySelectorAll('.del-user').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('이 이용인을 삭제할까요? 기록은 남아있지만 목록에서 제거됩니다.')) return;
      roster = roster.filter(u=>u.id!==b.dataset.id);
      await saveRoster();
      if(activeUserId===b.dataset.id) activeUserId = roster[0]?.id || null;
      populateTeacherFilter();
      renderUserList();
      renderRoster();
      await switchUser(activeUserId, true);
    });
  });
}

function daysInMonthList(y,m){
  const days = [];
  const last = new Date(y, m, 0).getDate();
  for(let d=1; d<=last; d++){
    const wk = new Date(y, m-1, d).getDay();
    if(hideWeekend && (wk===0||wk===6)) continue;
    days.push({day:d, wk});
  }
  return days;
}
async function loadRecordFor(userId,y,m){
  const days = daysInMonthList(y,m);
  const rec = {status:{}, personal:{}, personalNote:'', daily:{}, dailyNote:''};
  days.forEach(d=>{
    rec.status[d.day] = '등원';
    rec.personal[d.day] = {items:{individual:false,tv:false,fine:false,create:false,etc:false}, note:''};
    rec.daily[d.day] = {oral:'', diet:'', note:''};
  });
  try{
    const res = await window.storage.get(`record-${userId}-${y}-${m}`, false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      days.forEach(d=>{
        const legacyStatus = (loaded.personal && loaded.personal[d.day] && loaded.personal[d.day].status)
          || (loaded.daily && loaded.daily[d.day] && loaded.daily[d.day].status);
        if(loaded.status && loaded.status[d.day]) rec.status[d.day] = loaded.status[d.day];
        else if(legacyStatus) rec.status[d.day] = legacyStatus;
        if(loaded.personal && loaded.personal[d.day]){
          const {status, ...rest} = loaded.personal[d.day];
          rec.personal[d.day] = Object.assign({items:{}, note:''}, rest);
        }
        if(loaded.daily && loaded.daily[d.day]){
          const {status, ...rest} = loaded.daily[d.day];
          rec.daily[d.day] = Object.assign({oral:'', diet:'', note:''}, rest);
        }
      });
    }
  }catch(e){}
  return rec;
}

function monthRangeList(sy,sm,ey,em){
  const list = [];
  let y=sy, m=sm;
  let guard=0;
  while((y<ey || (y===ey && m<=em)) && guard<60){
    list.push({y,m});
    m++; if(m>12){ m=1; y++; }
    guard++;
  }
  return list;
}

async function computeStatsRange(sy,sm,ey,em){
  const months = monthRangeList(sy,sm,ey,em);
  let totalUsers = roster.length;
  let totalChecks = 0;
  let attendCount = 0;
  const perItem = {}; PERSONAL_ITEMS.forEach(it=>perItem[it.key]=0);
  for(const u of roster){
    for(const mo of months){
      const rec = await loadRecordFor(u.id, mo.y, mo.m);
      const days = daysInMonthList(mo.y, mo.m);
      days.forEach(d=>{
        const p = rec.personal[d.day];
        if(p){
          PERSONAL_ITEMS.forEach(it=>{ if(p.items[it.key]){ totalChecks++; perItem[it.key]++; } });
          if(rec.status[d.day]==='등원') attendCount++;
        }
      });
    }
  }
  return {totalUsers, totalChecks, attendCount, perItem, months};
}

function populateStatSelectors(){
  const years = [2025,2026,2027];
  const opts = (sel, val)=> years.map(y=>`<option value="${y}" ${y===val?'selected':''}>${y}년</option>`).join('');
  const mopts = (val)=> Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===val?'selected':''}>${m}월</option>`).join('');
  const startM = Math.max(1, month-2);
  document.getElementById('statStartY').innerHTML = opts(null, year);
  document.getElementById('statStartM').innerHTML = mopts(startM);
  document.getElementById('statEndY').innerHTML = opts(null, year);
  document.getElementById('statEndM').innerHTML = mopts(month);
}

async function runStats(){
  const sy = parseInt(document.getElementById('statStartY').value);
  const sm = parseInt(document.getElementById('statStartM').value);
  const ey = parseInt(document.getElementById('statEndY').value);
  const em = parseInt(document.getElementById('statEndM').value);
  document.getElementById('statsBody').innerHTML = '<div class="stat-line">계산 중…</div>';
  const s = await computeStatsRange(sy,sm,ey,em);
  document.getElementById('statsBody').innerHTML = `
    <div class="stat-line"><span>조회 기간</span><b>${sy}.${sm} ~ ${ey}.${em}</b></div>
    <div class="stat-line"><span>전체 이용인 수</span><b>${s.totalUsers}명</b></div>
    <div class="stat-line"><span>전체 개인활동 체크 수</span><b>${s.totalChecks}건</b></div>
    <div class="stat-line"><span>등원 처리 건수</span><b>${s.attendCount}건</b></div>
    ${PERSONAL_ITEMS.map(it=>`<div class="stat-line"><span>${it.label}</span><b>${s.perItem[it.key]}건</b></div>`).join('')}
  `;
}

document.getElementById('statsBtn').addEventListener('click', async ()=>{
  populateStatSelectors();
  document.getElementById('statsBody').innerHTML = '';
  document.getElementById('statsOverlay').classList.add('show');
  runStats();
});

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
document.getElementById('darkBtn').addEventListener('click', ()=>{

});

document.getElementById('teacherFilter').addEventListener('change', (e)=>{

  await loadRoster();
  populateYearMonth();

init();
